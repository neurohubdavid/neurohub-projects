<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; connect-src 'self'; img-src 'self' data:; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#120d22">
<meta name="color-scheme" content="dark light">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Phoenix Admin">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Phoenix backend (private)</title>
<style>
:root{--bg:#0e0a1a;--bg2:#150f26;--card:#1a1330;--card2:#231a40;--line:rgba(255,255,255,.09);--text:#f4f0ff;--muted:#a9a0c6;--accent:#8b5cf6;--accent2:#ec4899;--good:#34d399;--bad:#fb7185;--warn:#fbbf24;--shadow:0 10px 30px rgba(0,0,0,.35);--r:18px;--side:15.5rem}
@media (prefers-color-scheme:light){:root{--bg:#f6f3ff;--bg2:#ece6ff;--card:#fff;--card2:#f3eeff;--line:rgba(30,16,70,.12);--text:#1b1233;--muted:#5d5479;--accent:#6d35d6;--accent2:#d6246e;--good:#0f9d6b;--bad:#c4264a;--warn:#b7791f;--shadow:0 10px 28px rgba(60,30,140,.10)}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:radial-gradient(1200px 600px at 10% -10%,color-mix(in srgb,var(--accent) 22%,transparent),transparent 60%),var(--bg);background-attachment:fixed;color:var(--text);font:400 1rem/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
h1,h2,h3{line-height:1.2;margin:0}h2{font-size:1.15rem;margin:1.6rem 0 .3rem}h3{font-size:1rem}
.muted{color:var(--muted)}.err{color:var(--bad);font-weight:700}.small{font-size:.9rem}
button,input,select{font:inherit;color:var(--text)}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
/* buttons */
.btn,button{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;min-height:44px;padding:.5rem 1.1rem;border-radius:999px;border:1px solid var(--line);background:var(--card2);font-weight:650;cursor:pointer;transition:transform .12s,background .15s,border-color .15s}
button:hover{border-color:color-mix(in srgb,var(--accent) 60%,var(--line))}button:active{transform:scale(.98)}
button[disabled]{opacity:.55;cursor:default}
.primary,button[aria-pressed=true].seg-b{background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:transparent;color:#fff}
.danger{background:color-mix(in srgb,var(--bad) 18%,var(--card2));border-color:color-mix(in srgb,var(--bad) 50%,transparent)}
.ok-btn{background:color-mix(in srgb,var(--good) 18%,var(--card2));border-color:color-mix(in srgb,var(--good) 50%,transparent)}
input,select{min-height:44px;padding:.5rem .8rem;border-radius:12px;border:1px solid var(--line);background:var(--card2);width:100%}
label{display:block;margin:.8rem 0 .2rem;font-weight:650;font-size:.95rem}
/* sign-in */
#login-wrap{min-height:100vh;display:grid;place-items:center;padding:1.2rem;gap:1rem;align-content:center}
.login-card{width:min(26rem,100%);background:var(--card);border:1px solid var(--line);border-radius:24px;padding:1.6rem;box-shadow:var(--shadow)}
.login-card .logo{width:64px;height:64px;border-radius:18px;display:block;margin:0 auto .6rem}
.login-card h1{text-align:center;font-size:1.5rem}.login-card p.muted{text-align:center;margin:.2rem 0 .6rem}
.login-card form button{width:100%;margin-top:1.1rem}
.install-bar{width:min(26rem,100%);background:var(--card);border:1px dashed color-mix(in srgb,var(--accent) 55%,var(--line));border-radius:var(--r);padding:1rem 1.1rem}
.install-bar p{margin:.3rem 0}
/* shell */
#shell{display:grid;grid-template-columns:var(--side) 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:.3rem;padding:1.1rem .8rem;background:color-mix(in srgb,var(--bg2) 82%,transparent);border-right:1px solid var(--line);backdrop-filter:blur(10px)}
.brand{display:flex;align-items:center;gap:.7rem;padding:.2rem .5rem 1rem}.brand img{width:40px;height:40px;border-radius:12px}.brand b{display:block;line-height:1.15}.brand span{font-size:.82rem;color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:.2rem}
.nav button{justify-content:flex-start;border:0;background:transparent;border-radius:14px;padding:.55rem .8rem;color:var(--muted);font-weight:600;min-height:46px;width:100%}
.nav button svg{width:22px;height:22px;flex:none}.nav button:hover{background:var(--card);color:var(--text)}
.nav button[aria-current=page]{background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 32%,var(--card)),color-mix(in srgb,var(--accent2) 22%,var(--card)));color:var(--text);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 50%,transparent)}
.side .foot{margin-top:auto;padding:.6rem .5rem 0;border-top:1px solid var(--line);font-size:.88rem}
.content{min-width:0}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:.7rem;padding:.8rem 1.4rem;padding-top:max(.8rem,env(safe-area-inset-top));background:color-mix(in srgb,var(--bg) 80%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top h1{font-size:1.25rem;flex:1}.top .tools{display:flex;gap:.5rem;align-items:center}
.icon-btn{width:44px;padding:0}.icon-btn svg{width:20px;height:20px}
.seg{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px}.seg button{border:0;background:transparent;min-height:36px;padding:.2rem .85rem;font-weight:650;color:var(--muted)}.seg button[aria-pressed=true]{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
main{max-width:76rem;margin:0 auto;padding:1.2rem 1.4rem 5rem}
.tabbar{display:none}
/* cards and tiles */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:1.1rem 1.2rem;margin:1rem 0;box-shadow:var(--shadow);overflow-x:auto}
.card h2,.card h3{margin-top:0}
.hero{background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 38%,var(--card)),color-mix(in srgb,var(--accent2) 26%,var(--card)));border:1px solid color-mix(in srgb,var(--accent) 45%,var(--line));border-radius:24px;padding:1.4rem 1.5rem;margin:0 0 1rem}
.hero h2{margin:0;font-size:1.6rem}.hero p{margin:.3rem 0 0;color:color-mix(in srgb,var(--text) 78%,transparent)}
.chips{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:.9rem}
.chip{display:inline-flex;align-items:center;gap:.45rem;padding:.25rem .75rem;border-radius:999px;background:color-mix(in srgb,var(--bg) 45%,transparent);border:1px solid var(--line);font-size:.88rem;font-weight:650}
.dot{width:.6rem;height:.6rem;border-radius:50%;background:var(--muted);display:inline-block}.dot.good{background:var(--good);box-shadow:0 0 0 3px color-mix(in srgb,var(--good) 30%,transparent)}.dot.bad{background:var(--bad)}.dot.warn{background:var(--warn)}
.kpis{display:grid;gap:.8rem;grid-template-columns:repeat(auto-fit,minmax(10rem,1fr));margin:.8rem 0}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:.8rem .95rem;position:relative;overflow:hidden}
.kpi b{display:block;font-size:1.85rem;line-height:1.1;letter-spacing:-.02em}.kpi span{color:var(--muted);font-size:.88rem;display:block;margin-top:.15rem}
.kpi.big{padding-bottom:2.3rem}.kpi .sp{position:absolute;left:.7rem;right:.7rem;bottom:.35rem;height:30px;width:calc(100% - 1.4rem)}
.delta{position:absolute;top:.7rem;right:.7rem;font-size:.78rem;font-weight:700;padding:.1rem .5rem;border-radius:999px;background:color-mix(in srgb,var(--muted) 18%,transparent);color:var(--muted)}.delta.up{background:color-mix(in srgb,var(--good) 20%,transparent);color:var(--good)}.delta.down{background:color-mix(in srgb,var(--bad) 20%,transparent);color:var(--bad)}
.grid{display:grid;gap:1rem;grid-template-columns:repeat(auto-fit,minmax(18rem,1fr))}.grid .card{margin:0}
.row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}
.alert{display:flex;gap:.7rem;align-items:flex-start;padding:.7rem .9rem;border-radius:14px;border:1px solid var(--line);background:var(--card2);margin:.5rem 0}
.alert.warn{border-color:color-mix(in srgb,var(--warn) 55%,transparent)}.alert.bad{border-color:color-mix(in srgb,var(--bad) 55%,transparent)}.alert.good{border-color:color-mix(in srgb,var(--good) 45%,transparent)}
table{border-collapse:collapse;width:100%}th,td{border-bottom:1px solid var(--line);padding:.45rem .55rem;text-align:left}th{color:var(--muted);font-size:.82rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em}td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}tr:last-child td{border-bottom:0}
.bars{display:flex;align-items:flex-end;gap:3px;height:120px;border-bottom:1px solid var(--line)}.bars i{flex:1;background:linear-gradient(180deg,var(--accent2),var(--accent));min-width:2px;border-radius:5px 5px 0 0;opacity:.95}.bars i:hover{opacity:1;filter:brightness(1.2)}
svg.chart{width:100%;height:auto}.chart .grid-l{stroke:var(--line)}.chart text{fill:var(--muted);font-size:11px}
.tg label{display:inline-flex;gap:.4rem;align-items:center;margin:.2rem .9rem .2rem 0;font-weight:500}.tg input{width:auto;min-height:0}
details.card summary{cursor:pointer;font-weight:700}
.switchrow{display:flex;gap:1rem;align-items:center;justify-content:space-between;flex-wrap:wrap}
.skeleton{height:5.5rem;border-radius:16px;background:linear-gradient(90deg,var(--card),var(--card2),var(--card));background-size:200% 100%;animation:sh 1.3s linear infinite;margin:.8rem 0}
@keyframes sh{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.skeleton{animation:none}button{transition:none}}
/* phone: bottom tab bar instead of the side menu */
@media (max-width:860px){
  #shell{display:block}.side{display:none}
  .top{padding:.6rem .9rem;padding-top:max(.6rem,env(safe-area-inset-top))}.top h1{font-size:1.1rem}
  main{padding:.9rem .9rem calc(6.2rem + env(safe-area-inset-bottom))}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:6;background:color-mix(in srgb,var(--bg2) 90%,transparent);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:.35rem .4rem calc(.35rem + env(safe-area-inset-bottom))}
  .tabbar button{flex-direction:column;gap:.1rem;border:0;background:transparent;border-radius:14px;padding:.3rem 0;min-height:52px;font-size:.72rem;color:var(--muted);font-weight:650}
  .tabbar button svg{width:23px;height:23px}.tabbar button[aria-current=page]{color:var(--text);background:color-mix(in srgb,var(--accent) 24%,transparent)}
  .hero{padding:1.1rem 1.1rem}.hero h2{font-size:1.35rem}.kpi b{font-size:1.55rem}th,td{padding:.4rem .4rem;font-size:.92rem}
  .seg button{padding:.2rem .6rem}
}
</style>
</head>
<body>
<div id="login-wrap">
  <div class="install-bar" id="install-admin" hidden><strong>Get the backend as an app on this device</strong><p class="muted small" id="install-admin-help"></p><p><button type="button" class="primary" id="install-admin-btn">Install the Phoenix backend app</button></p></div>
  <div class="login-card" id="login" hidden>
    <img class="logo" src="icons/icon-192.png" alt="" width="64" height="64">
    <h1>Phoenix backend</h1>
    <p class="muted">Private. For people with the Admin role only.</p>
    <form id="form" autocomplete="off">
      <label for="u">Username</label><input id="u" autocomplete="username" required>
      <label for="p">Password</label><input id="p" type="password" autocomplete="current-password" required>
      <label for="c">Code from your authenticator app</label><input id="c" inputmode="numeric" pattern="[0-9 ]*" maxlength="7" autocomplete="one-time-code" required>
      <button id="go" class="primary" type="submit">Sign in</button>
      <p id="msg" class="err" role="status" style="text-align:center;margin:.6rem 0 0"></p>
    </form>
  </div>
</div>
<div id="shell" hidden>
  <aside class="side" aria-label="Phoenix backend"><div class="brand"><img src="icons/icon-192.png" alt="" width="40" height="40"><div><b>Phoenix</b><span>Backend</span></div></div><nav class="nav" id="nav" aria-label="Sections"></nav><div class="foot"><div class="muted" id="who"></div></div></aside>
  <div class="content">
    <header class="top"><h1 id="title">Home</h1><div class="tools" id="tools"></div></header>
    <main id="app" tabindex="-1"></main>
  </div>
  <nav class="tabbar" id="tabbar" aria-label="Sections"></nav>
</div>
<script src="admin.js"></script>
<script src="admin-pwa.js"></script>
</body>
</html>
