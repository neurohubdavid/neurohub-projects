<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Phoenix numbers (private)</title>
<style>
:root{--bg:#fffbf2;--card:#fff;--text:#16121f;--muted:#55506b;--line:#16121f;--accent:#6d35d6}
@media (prefers-color-scheme:dark){:root{--bg:#120f1c;--card:#1d1833;--text:#f4f0ff;--muted:#bdb5d6;--line:#cdbdff;--accent:#b98aff}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:1rem/1.6 system-ui,sans-serif}main{max-width:64rem;margin:0 auto;padding:1rem 1rem 4rem}
h1,h2{line-height:1.2}.card{background:var(--card);border:2.5px solid var(--line);border-radius:14px;padding:1rem;margin:1rem 0}
.kpis{display:grid;gap:.75rem;grid-template-columns:repeat(auto-fit,minmax(9rem,1fr))}.kpi{border:2px solid var(--line);border-radius:12px;padding:.6rem .8rem;background:var(--card)}.kpi b{display:block;font-size:1.8rem;line-height:1.1}.kpi span{color:var(--muted);font-size:.9rem}
button,input,select{font:inherit;padding:.5em .9em;border:2px solid var(--line);border-radius:999px;background:var(--card);color:var(--text)}button{font-weight:700;cursor:pointer}input{border-radius:10px}
table{border-collapse:collapse;width:100%}th,td{border-bottom:1px solid color-mix(in srgb,var(--text) 20%,transparent);padding:.3rem .5rem;text-align:left}td.n,th.n{text-align:right}
.bars{display:flex;align-items:flex-end;gap:2px;height:120px;border-bottom:2px solid var(--line)}.bars i{flex:1;background:var(--accent);min-width:2px;border-radius:3px 3px 0 0}
.grid{display:grid;gap:1rem;grid-template-columns:repeat(auto-fit,minmax(18rem,1fr))}.muted{color:var(--muted)}.err{color:#b3261e;font-weight:700}
</style>
</head>
<body>
<main>
  <h1>Phoenix numbers</h1>
  <p class="muted">Private. Anonymous daily counts only: no cookies, no identifiers, no messages. Rough numbers, since people who block counting are not included.</p>
  <div class="card" id="login">
    <label>Access key <input id="key" type="password" autocomplete="off" aria-label="Access key" size="34"></label>
    <button id="go">Show numbers</button>
    <select id="days" aria-label="Period"><option value="7">7 days</option><option value="30" selected>30 days</option><option value="90">90 days</option><option value="365">365 days</option></select>
    <span id="msg" class="err" role="status"></span>
  </div>
  <div id="out" hidden></div>
</main>
<script src="stats.js"></script>
</body>
</html>
