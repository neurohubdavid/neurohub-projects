<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Phoenix, a neuro-affirming AI assistant</title>
  <meta name="description" content="Phoenix is a free, private, neuro-affirming AI assistant for Autistic, ADHD and other neurodivergent people. Bring your own AI, or run it on your own device.">
  <meta name="theme-color" content="#a66bff">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; media-src 'self' data: blob:; connect-src 'self' http: https:; object-src 'none'; base-uri 'none'; form-action 'none'">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Phoenix">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="application-name" content="Phoenix">
  <meta name="format-detection" content="telephone=no">
  <link rel="stylesheet" href="css/brand.css">
  <link rel="stylesheet" href="css/mascot.css">
  <link rel="stylesheet" href="css/app.css">
  <script src="js/theme-boot.js"></script>
</head>
<body>
  <a class="skip-link" href="#view">Skip to content</a>
  <div class="app" id="app">
    <header class="top">
      <div class="brand" id="brand"><span class="name">Phoenix</span></div>
      <nav class="nav" id="nav" aria-label="Main"></nav>
      <button class="btn btn-sm btn-primary" id="install-btn" hidden title="Install Phoenix as an app on this device">Install</button>
      <button class="btn btn-sm donate-btn" id="donate-btn" type="button" aria-haspopup="dialog" aria-label="Donate to NeuroHub Community, which makes Phoenix" title="Phoenix is free. Donations to NeuroHub Community help keep it that way."><span aria-hidden="true">♥</span><span class="donate-text"> Donate</span></button>
      <button class="btn btn-sm" id="a11y-btn" aria-label="Accessibility settings: font, text size, spacing, colours and voice" title="Accessibility (Alt + A)">Aa</button>
      <button class="btn btn-sm help-btn" id="help-btn" aria-label="Get help now, crisis and emergency support">Help</button>
    </header>
    <div id="install-invite-host"></div>
    <div id="donate-nudge-host"></div>
    <main class="view" id="view" tabindex="-1"></main>
  </div>
  <noscript><p style="padding:1rem">Phoenix needs JavaScript to run.</p></noscript>
  <script type="module" src="js/main.js"></script>
</body>
</html>
